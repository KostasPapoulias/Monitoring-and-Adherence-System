<div class="flex-1 p-3 md:p-5 rounded-2xl bg-white/5 border border-white/10 overflow-hidden flex flex-col min-h-0 animate-fade-in mobile-week">
  <div class="flex items-center justify-between mb-1">
    <div class="text-white/70 text-[10px] uppercase font-black tracking-widest">{{ state.deviceMode === 'smartwatch' ? 'W' : 'This Week' }}</div>
    <div *ngIf="state.deviceMode !== 'smartwatch'" class="text-[10px] text-white/40">{{ state.medications.length }}</div>
  </div>
  <div class="h-px bg-white/10 mb-3"></div>

  <!-- SMARTWATCH: one medication at a time -->
  <div *ngIf="state.deviceMode === 'smartwatch'" class="flex-1 min-h-0 relative overflow-hidden">
    <button type="button" class="arrow up" (click)="prevMed.emit()" aria-label="Previous medication">˄</button>
    <button type="button" class="arrow down" (click)="nextMed.emit()" aria-label="Next medication">˅</button>

    <div *ngIf="state.currentMed as m" class="h-full flex flex-col justify-center">
      <div class="watch-week-card p-1 rounded-2xl bg-black/20 border border-white/10">
        <div class="text-emerald-400 font-black text-base truncate">{{m.name}}</div>
        <div class="text-white/70 text-xs truncate">{{m.dosage}}</div>
        <div class="mt-2 inline-block text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded-xl uppercase font-black">{{m.frequency}}</div>
        <div class="mt-3 flex flex-wrap gap-1">
          <span *ngFor="let day of ['M','T','W','T','F','S','S']" class="watch-week-chip w-6 h-6 flex items-center justify-center rounded-lg text-[9px] border border-white/5 bg-white/5">
            {{day}}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- NON-WATCH: grid -->
  <div *ngIf="state.deviceMode !== 'smartwatch'" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar pr-1">
    <div class="grid grid-cols-1 gap-3">
      <div *ngFor="let m of state.medications" class="p-4 rounded-2xl bg-black/20 border border-white/10 hover:bg-black/30 transition-all">
        <div class="flex justify-between items-start mb-2 gap-3">
          <h4 class="text-md font-bold text-emerald-400 m-0 truncate">{{m.name}}</h4>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-1.5 py-0.5 rounded-md uppercase font-bold flex-none">{{m.frequency}}</span>
        </div>
        <div class="flex flex-wrap gap-2 text-sm">
          <div class="flex justify-between w-full">
            <span class="text-white/40">Dosage</span>
            <span class="text-white font-medium">{{m.dosage}}</span>
          </div>
          <div class="flex flex-wrap gap-1 mt-1">
            <span *ngFor="let day of ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']"
                  class="w-7 h-7 flex items-center justify-center rounded-lg text-[10px] border border-white/5 bg-white/5">
              {{day}}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
