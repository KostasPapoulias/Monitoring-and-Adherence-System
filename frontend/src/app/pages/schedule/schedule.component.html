<div class="schedule-container dashboard-shell h-full w-full flex flex-col p-3 md:p-6 overflow-hidden text-white"
     [ngClass]="{
       'compact-mode': isCompactMode,
       'watch-mode': deviceMode === 'smartwatch',
       'speaker-mode': deviceMode === 'smart-speaker',
       'text-large': uiTextSize === 'large'
     }">

  <div class="schedule-header flex items-center gap-3 mb-2 md:mb-4 flex-wrap">
    <h1 *ngIf="deviceMode !== 'smartwatch'" class="m-0 text-2xl md:text-4xl font-bold tracking-tight">Medication Schedule</h1>
    <select class="ml-auto bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-sm md:text-base w-full md:w-auto focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all"
            [ngModel]="selectedPersonaId" (ngModelChange)="onPersonaChange($event)">
      <option *ngFor="let p of personas" [value]="p._id">{{p.name}}</option>
    </select>
  </div>

    <div class="flex gap-1 mb-2 md:mb-4 bg-black/20 p-0.1 rounded-2xl border border-white/5"
      [class.w-fit]="deviceMode !== 'smartwatch'"
      [class.w-full]="deviceMode === 'smartwatch'"
      [class.justify-center]="deviceMode === 'smartwatch'">
      <button (click)="setView('day')"
        [class.active-tab]="view==='day'" class="tab-btn">
        <span *ngIf="deviceMode !== 'smartwatch'">Today</span>
        <span *ngIf="deviceMode === 'smartwatch'">D</span>
      </button>
      <button (click)="setView('week')"
        [class.active-tab]="view==='week'" class="tab-btn">
        <span *ngIf="deviceMode !== 'smartwatch'">This Week</span>
        <span *ngIf="deviceMode === 'smartwatch'">W</span>
      </button>
      <button (click)="setView('month')"
        [class.active-tab]="view==='month'" class="tab-btn">
        <span *ngIf="deviceMode !== 'smartwatch'">Monthly Overview</span>
        <span *ngIf="deviceMode === 'smartwatch'">M</span>
      </button>
  </div>

  <div class="schedule-body flex-1 min-h-0 overflow-auto custom-scrollbar flex flex-col">

    <app-day-view *ngIf="view==='day'"
      [state]="state"
      [getNextDoseTime]="getNextDoseTime.bind(this)"
      [doseCount]="doseCount.bind(this)"
      (prevMed)="prevMed()"
      (nextMed)="nextMed()">
    </app-day-view>

    <app-week-view *ngIf="view==='week'"
      [state]="state"
      (prevMed)="prevMed()"
      (nextMed)="nextMed()">
    </app-week-view>

    <app-month-view *ngIf="view==='month'"
      [state]="state"
      (prevMed)="prevMed()"
      (nextMed)="nextMed()">
    </app-month-view>

  </div>
</div>
