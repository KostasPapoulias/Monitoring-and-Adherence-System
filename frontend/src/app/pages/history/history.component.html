<div class="dashboard-shell h-full w-full flex flex-col p-3 md:p-6 overflow-hidden">
  
  <div class="history-header flex items-center gap-3 mb-3 md:mb-5 flex-wrap">
    <h1 class="m-0 text-xl md:text-3xl font-bold tracking-tight">History</h1>
    <select class="ml-auto bg-white/5 border border-white/10 rounded-2xl px-3 py-2 text-sm md:text-base focus:ring-2 focus:ring-emerald-500/50 outline-none transition-all"
            [ngModel]="selectedPersonaId" (ngModelChange)="onPersonaChange($event)">
      <option *ngFor="let p of personas" [value]="p._id">{{p.name}}</option>
    </select>
  </div>

  <app-kpi-strip [state]="state"></app-kpi-strip>

  <div class="history-body grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-4 flex-1 min-h-0">
    <app-medication-breakdown *ngIf="deviceMode !== 'smartwatch'" [state]="state"></app-medication-breakdown>

    <app-actions-list
      [state]="state"
      (prevEvent)="prevEvent()"
      (nextEvent)="nextEvent()"
      (setType)="setEventType($event.event, $event.type)"
      (cancel)="cancelTaken($event)">
    </app-actions-list>
  </div>
</div>
