<div class="app-shell h-screen w-full overflow-hidden bg-neutral-900 text-neutral-100 flex flex-col">
  
  <header class="topbar flex-none flex items-center justify-between px-4 md:px-6 py-3 bg-black/30 backdrop-blur-sm border-b border-white/10">
    <div class="flex items-center gap-2">
      <span class="uppercase tracking-widest text-lg md:text-xl text-neutral-200">Smart Wall</span>
    </div>
    <div class="flex items-center gap-4 text-neutral-300 text-sm md:text-base">
      <span class="hidden sm:inline">Wi‑Fi</span>
      <span class="font-medium text-lg md:text-2xl">{{ currentTime }}</span>
    </div>
  </header>

  <main class="content-wrapper flex-1 min-h-0 overflow-hidden flex flex-col w-full">
    <div class="content-panel h-full flex flex-col border-b border-white/10 bg-white/5 shadow-inner overflow-hidden w-full">
      
      <ng-container *ngIf="useBurgerNav; else desktopNav">
        <div class="burger-nav p-3 border-b border-white/10 bg-black/30">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button type="button" class="burger-toggle" (click)="toggleBurger()" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
              </button>
              <div class="leading-tight">
                <div class="text-sm text-neutral-300">Menu</div>
                <div class="font-semibold text-lg">{{ selectedPersona?.name || 'Navigation' }}</div>
              </div>
            </div>
            <div class="text-sm text-neutral-300">{{ currentTime }}</div>
          </div>
          <div *ngIf="burgerOpen" class="burger-menu mt-3 flex flex-col gap-2">
            <a routerLink="/dashboard" routerLinkActive="!bg-emerald-600" class="burger-link">Dashboard</a>
            <a routerLink="/schedule" routerLinkActive="!bg-emerald-600" class="burger-link">Schedule</a>
            <a routerLink="/history" routerLinkActive="!bg-emerald-600" class="burger-link">History</a>
            <a routerLink="/emergency" routerLinkActive="!bg-red-600/70" class="burger-link danger">Emergency</a>
          </div>
        </div>
      </ng-container>

      <ng-template #desktopNav>
        <nav class="primary-nav flex-none flex flex-wrap gap-2 p-3 border-b border-white/10 bg-black/20">
          <a routerLink="/dashboard" routerLinkActive="!bg-emerald-600" class="px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 transition">Dashboard</a>
          <a routerLink="/schedule" routerLinkActive="!bg-emerald-600" class="px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 transition">Schedule</a>
          <a routerLink="/history" routerLinkActive="!bg-emerald-600" class="px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 transition">History</a>
          <a routerLink="/emergency" routerLinkActive="!bg-emerald-600" class="px-3 py-1.5 rounded bg-red-600/60 hover:bg-red-600/80 transition">Emergency</a>
        </nav>
      </ng-template>

      <div class="route-content flex-1 p-4 md:p-6 overflow-hidden">
        <router-outlet></router-outlet>
      </div>
      
    </div>
  </main>
</div>
