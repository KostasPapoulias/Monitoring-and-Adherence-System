<div class="app-shell h-screen w-full overflow-hidden bg-neutral-900 text-neutral-100 flex flex-col"
  [class.mode-wall]="isWallMode"
  [class.mode-phone]="isPhoneMode"
  [class.mode-watch]="isWatchMode"
  [class.mode-speaker]="isSpeakerMode">

  <header *ngIf="!isWatchMode" class="topbar flex-none flex items-center justify-between px-4 py-1 bg-black/30 backdrop-blur-sm border-b border-white/10">
    <span class="uppercase tracking-widest text-lg text-neutral-200">
      Smart Wall
    </span>
    <span class="font-medium text-lg">
      {{ currentTime }}
    </span>
  </header>

  <main class="content-wrapper flex-1 min-h-0 overflow-hidden flex flex-col w-full">
    
    <!-- WATCH LEFT/RIGHT ARROWS -->
    <button *ngIf="isWatchMode" type="button" class="watch-nav-arrow watch-nav-arrow-left" (click)="watchPrev()" aria-label="Previous page">
      ‹
    </button>
    <button *ngIf="isWatchMode" type="button" class="watch-nav-arrow watch-nav-arrow-right" (click)="watchNext()" aria-label="Next page">
      ›
    </button>

    <div class="content-panel h-full flex flex-col bg-white/5 overflow-hidden w-full">

      <!-- WALL SCREEN NAV  -->
      <nav *ngIf="!isCompactMode"
        class="primary-nav flex-none flex gap-2 p-3 border-b border-white/10 bg-black/20">
        <a routerLink="/dashboard" routerLinkActive="!bg-emerald-600" class="nav-btn">Dashboard</a>
        <a routerLink="/schedule" routerLinkActive="!bg-emerald-600" class="nav-btn">Schedule</a>
        <a routerLink="/history" routerLinkActive="!bg-emerald-600" class="nav-btn">History</a>
        <a routerLink="/emergency" routerLinkActive="!bg-red-600" class="nav-btn danger">Emergency</a>
      </nav>

      <!-- CONTENT -->
      <div class="route-content flex-1 min-h-0 overflow-hidden"
           [class.phone-content]="isCompactMode">
        <router-outlet></router-outlet>
      </div>

      <!-- PHONE/SPEAKER BOTTOM NAV -->
      <nav *ngIf="isCompactMode && !isWatchMode" class="bottom-nav">
        <a routerLink="/dashboard" routerLinkActive="active">
          <span>🏠</span>
          <small>Home</small>
        </a>
        <a routerLink="/schedule" routerLinkActive="active">
          <span>📅</span>
          <small>Schedule</small>
        </a>
        <a routerLink="/history" routerLinkActive="active">
          <span>🕘</span>
          <small>History</small>
        </a>
        <a routerLink="/emergency" routerLinkActive="active" class="danger">
          <span>🚨</span>
          <small>Emergency</small>
        </a>
      </nav>

    </div>
  </main>
</div>
