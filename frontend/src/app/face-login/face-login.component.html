<div class="face-login">
  <div class="container">
    <div class="video-wrapper" *ngIf="state !== 'SETUP'">
      <video #videoEl autoplay muted playsinline></video>
      <div class="status-overlay">{{ statusText }}</div>
    </div>
    
    <!-- Temporary: Persona selector (replace with face recognition when images available) -->
    <div class="persona-selector" *ngIf="state === 'SETUP'">
      <h1>Select User</h1>
      <p class="subtitle">Face recognition not yet configured.<br>Choose a user to continue:</p>
      <div class="personas-grid">
        <button 
          *ngFor="let persona of personas" 
          (click)="selectPersona(persona)"
          class="persona-btn"
          [disabled]="state !== 'SETUP'">
          {{ persona }}
        </button>
      </div>
    </div>
  </div>
</div>
